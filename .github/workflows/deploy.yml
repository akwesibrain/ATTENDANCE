name: Deploy to Vercel

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Vercel deployment target'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    name: Test & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint & Run tests
        run: |
          npm run lint
          npm test

      - name: Install Vercel CLI
        run: npm install --global vercel@48.6.6

      - name: Deploy to Production
        id: deploy-prod
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
        run: |
          vercel pull --yes --environment=production
          vercel build --prod
          url=$(vercel deploy --prebuilt --prod --yes)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed to Production" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL**: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy Preview
        id: deploy-preview
        if: (github.event_name == 'push' && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.target == 'preview')
        run: |
          vercel pull --yes --environment=preview
          vercel build
          url=$(vercel deploy --prebuilt --yes)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL**: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment Preview URL on Open PR
        if: steps.deploy-preview.outputs.url != '' && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`,
              state: 'open',
            });
            for (const pr of prs) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `Vercel Preview ready: ${{ steps.deploy-preview.outputs.url }}`,
              });
            }

